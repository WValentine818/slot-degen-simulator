<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SLOT DEGEN SIMULATOR</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="machine">

        <h1>SLOT DEGEN SIMULATOR</h1>

        <p class="balance">
            Balance: <span id="balance">1000</span> coins
        </p>

        <div class="reels">
            <div class="reel" id="reel1">🍒</div>
            <div class="reel" id="reel2">🔔</div>
            <div class="reel" id="reel3">💎</div>
        </div>

        <p>
            Bet: <span id="bet">10</span> coins
        </p>

        <button id="spinButton">SPIN</button>

        <p id="message">Ready to spin.</p>

<div class="paytable">

    <h2>PAYTABLE</h2>

    <p>🍒 🍒 🍒 = 2x</p>
    <p>🔔 🔔 🔔 = 5x</p>
    <p>💎 💎 💎 = 10x</p>
    <p>⭐ ⭐ ⭐ = 20x</p>
    <p>👑 👑 👑 = 80x</p>

</div>

    </main>

    <script src="game.js"></script>

</body>
</html>
